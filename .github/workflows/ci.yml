name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: Validate API contract & examples
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation tooling
        run: pip install --quiet pyyaml jsonschema openapi-spec-validator

      - name: Validate OpenAPI 3.0 contract
        run: python -m openapi_spec_validator docs/openapi.yaml

      - name: Validate YAML files parse
        run: |
          python - <<'PY'
          import yaml
          for f in ["docs/openapi.yaml", ".github/workflows/ci.yml"]:
              with open(f) as fh:
                  yaml.safe_load(fh)
              print(f"yaml OK: {f}")
          PY

      - name: Validate example scenarios are valid JSON
        run: |
          python - <<'PY'
          import json, glob
          files = glob.glob("examples/**/scenarios.json", recursive=True)
          assert files, "no example scenarios found"
          for f in files:
              with open(f) as fh:
                  json.load(fh)
              print(f"json OK: {f}")
          PY

      - name: Validate CITATION.cff parses
        run: |
          python - <<'PY'
          import yaml
          with open("CITATION.cff") as fh:
              yaml.safe_load(fh)
          print("CITATION.cff OK")
          PY

  lint:
    name: Lint Markdown & check links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            #node_modules
        continue-on-error: true

      - name: Check Markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "yes"
          config-file: ".github/markdown-link-check.json"
